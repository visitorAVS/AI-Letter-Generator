<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Chithi - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 50px 40px;
            text-align: center;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 40px;
        }

        #google-btn-container {
            margin-bottom: 20px;
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .info {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
            color: #333;
            font-size: 13px;
            line-height: 1.6;
            margin-top: 20px;
        }

        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <div class="logo">📝</div>
        <h1>Smart Chithi</h1>
        <p class="subtitle">Professional letters in seconds</p>

        <div class="error" id="error"></div>

        <!-- Google Button will render here -->
        <div id="google-btn-container"></div>

        <div class="info">
            ✨ Free to use | No credit card required | All your letters are saved privately
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        const GOOGLE_CLIENT_ID = '984414663445-dvc8j5nmu3u5qpdc8avvotugafp6531c.apps.googleusercontent.com';

        function handleCredentialResponse(response) {
            const token = response.credential;
            
            document.getElementById('loading').classList.add('active');

            fetch('/auth/google', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ token: token })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/home';
                } else {
                    showError(data.error || 'Login failed');
                    document.getElementById('loading').classList.remove('active');
                }
            })
            .catch(error => {
                showError('Network error: ' + error.message);
                document.getElementById('loading').classList.remove('active');
            });
        }

        function showError(msg) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = msg;
            errorDiv.classList.add('show');
        }

        window.onload = function() {
            if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleCredentialResponse,
                    auto_select: false
                });

                google.accounts.id.renderButton(
                    document.getElementById('google-btn-container'),
                    {
                        theme: 'outline',
                        size: 'large',
                        text: 'signin_with'
                    }
                );
            } else {
                showError('Google Sign-In library failed to load. Please refresh the page.');
            }
        };
    </script>
</body>
</html>
