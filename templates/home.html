<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Chithi - AI Letter Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --secondary: #f093fb;
            --success: #10b981;
            --danger: #ef4444;
            --light: #eff6ff;
            --dark: #1e3a8a;
            --gray: #6b7280;
            --border: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 50%, var(--secondary) 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        .navbar {
            background: white;
            padding: 15px 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            background: white;
            padding: 40px;
            border-radius: 15px;
            margin-bottom: 40px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 32px;
            color: var(--dark);
            margin-bottom: 10px;
        }

        .header p {
            color: var(--gray);
            font-size: 16px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .form-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .form-section h2 {
            font-size: 24px;
            color: var(--dark);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--dark);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
            width: 100%;
        }

        .btn-secondary:hover {
            background: var(--light);
        }

        .preview-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .preview-section h2 {
            font-size: 24px;
            color: var(--dark);
            margin-bottom: 20px;
        }

        .letter-preview {
            background: var(--light);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            min-height: 400px;
            max-height: 600px;
            overflow-y: auto;
            font-family: Georgia, serif;
            line-height: 1.8;
            color: var(--dark);
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 20px;
            display: none;
        }

        .letter-preview.active {
            display: block;
        }

        .empty-preview {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
            background: var(--light);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .empty-preview i {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.4;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            animation: slideIn 0.3s ease-out;
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid var(--success);
        }

        .message.error {
            background: #fee2e2;
            color: #7f1d1d;
            border-left: 4px solid var(--danger);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--primary);
        }

        .spinner {
            border: 4px solid var(--light);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .history-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
        }

        .history-section h2 {
            font-size: 24px;
            color: var(--dark);
            margin-bottom: 25px;
        }

        .letters-table {
            width: 100%;
            border-collapse: collapse;
        }

        .letters-table th {
            background: var(--light);
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: var(--dark);
            border-bottom: 2px solid var(--border);
        }

        .letters-table td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        .letters-table tr:last-child td {
            border-bottom: none;
        }

        .letters-table tr:hover td {
            background: #f9fafb;
        }

        .letter-badge {
            display: inline-block;
            padding: 4px 12px;
            background: var(--light);
            color: var(--primary);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            margin-right: 5px;
            transition: all 0.2s;
        }

        .btn-view {
            background: var(--primary);
            color: white;
        }

        .btn-view:hover {
            background: var(--primary-dark);
        }

        .btn-edit {
            background: #3b82f6;
            color: white;
        }

        .btn-edit:hover {
            background: #2563eb;
        }

        .btn-delete {
            background: var(--danger);
            color: white;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 200;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease-out;
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease-out;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }

        .modal-header h2 {
            color: var(--dark);
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--gray);
            transition: all 0.2s;
        }

        .modal-close:hover {
            color: var(--dark);
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        .btn-cancel {
            background: var(--border);
            color: var(--dark);
            padding: 10px 20px;
        }

        .btn-cancel:hover {
            background: #d1d5db;
        }

        .btn-save {
            background: var(--success);
            color: white;
            padding: 10px 20px;
        }

        .btn-save:hover {
            background: #059669;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .preview-section {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }
            .letters-table {
                font-size: 12px;
            }
            .letters-table th,
            .letters-table td {
                padding: 10px;
            }
            .action-btn {
                padding: 4px 8px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <i class="fas fa-pen-nib"></i> Smart Chithi
        </div>
        <div class="user-menu">
            <div class="user-avatar" id="userAvatar">👤</div>
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Welcome back, <span id="userName">User</span>! 👋</h1>
            <p>Generate professional letters with AI in seconds</p>
        </div>

        <div class="main-content">
            <!-- Form Section -->
            <div class="form-section">
                <h2><i class="fas fa-edit"></i> Create Letter</h2>

                <div id="formMessage"></div>

                <form id="letterForm" onsubmit="generateLetter(event)">
                    <div class="form-group">
                        <label>Letter Type</label>
                        <select id="letterType" required onchange="toggleCustom()">
                            <option value="">Select letter type</option>
                            <option value="Job Application">💼 Job Application</option>
                            <option value="Resignation Letter">👋 Resignation Letter</option>
                            <option value="Leave Application">🏖️ Leave Application</option>
                            <option value="Complaint Letter">⚠️ Complaint Letter</option>
                            <option value="Request Letter">📬 Request Letter</option>
                            <option value="Formal Email">📧 Formal Email</option>
                            <option value="Recommendation Letter">⭐ Recommendation Letter</option>
                            <option value="custom">✨ Others (Custom)</option>
                        </select>
                    </div>

                    <div class="form-group" id="customGroup" style="display: none;">
                        <label>Letter Type (Custom)</label>
                        <input type="text" id="customType" placeholder="e.g., Appreciation Letter">
                    </div>

                    <div class="form-group">
                        <label>Language</label>
                        <select id="language" required>
                            <option value="English">🇬🇧 English</option>
                            <option value="Hindi">🇮🇳 Hindi</option>
                            <option value="Marathi">🌾 Marathi</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" id="senderName" required placeholder="John Doe">
                    </div>

                    <div class="form-group">
                        <label>Recipient Name</label>
                        <input type="text" id="receiverName" required placeholder="Mr. Smith">
                    </div>

                    <div class="form-group">
                        <label>Recipient Designation</label>
                        <input type="text" id="receiverDesignation" required placeholder="HR Manager">
                    </div>

                    <div class="form-group">
                        <label>Organization</label>
                        <input type="text" id="organization" placeholder="ABC Corporation">
                    </div>

                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" id="subject" required placeholder="Application for...">
                    </div>

                    <div class="form-group">
                        <label>Additional Details <span style="color:var(--gray);font-weight:400;">(optional)</span></label>
                        <textarea id="reason" placeholder="Any extra context, dates, or details..." style="min-height: 80px;"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Tone</label>
                        <select id="tone" required>
                            <option value="Formal">🎩 Formal</option>
                            <option value="Professional">👔 Professional</option>
                            <option value="Polite">🤝 Polite</option>
                            <option value="Urgent">⚡ Urgent</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-magic"></i> Generate Letter
                    </button>
                </form>
            </div>

            <!-- Preview Section -->
            <div class="preview-section">
                <h2><i class="fas fa-file-alt"></i> Preview</h2>

                <div id="loading" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Generating your letter...</p>
                </div>

                <div id="letterPreview" class="letter-preview"></div>

                <div id="emptyPreview" class="empty-preview">
                    <i class="fas fa-file-alt"></i>
                    <p>Fill the form and click <strong>Generate Letter</strong></p>
                </div>

                <div id="actionButtons" class="action-buttons" style="display: none;">
                    <button class="btn btn-primary" type="button" onclick="copyLetter()">
                        <i class="fas fa-copy"></i> Copy to Clipboard
                    </button>
                    <button class="btn btn-primary" type="button" onclick="downloadPDF()">
                        <i class="fas fa-file-pdf"></i> Download PDF
                    </button>
                    <button class="btn btn-primary" type="button" onclick="downloadTXT()">
                        <i class="fas fa-file-download"></i> Download TXT
                    </button>
                    <button class="btn btn-primary" type="button" onclick="printLetter()">
                        <i class="fas fa-print"></i> Print
                    </button>
                </div>
            </div>
        </div>

        <!-- History Section -->
        <div class="history-section">
            <h2><i class="fas fa-history"></i> Your Letters</h2>
            <table class="letters-table">
                <thead>
                    <tr>
                        <th>Letter Type</th>
                        <th>Subject</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="lettersBody">
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 30px; color: #999;">
                            Loading letters...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Letter</h2>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <div id="editModalMessage"></div>
            <form id="editForm">
                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" id="editSubject" placeholder="Subject">
                </div>
                <div class="form-group">
                    <label>Sender Name</label>
                    <input type="text" id="editSenderName" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label>Recipient Name</label>
                    <input type="text" id="editReceiverName" placeholder="Recipient Name">
                </div>
                <div class="form-group">
                    <label>Recipient Designation</label>
                    <input type="text" id="editReceiverDesignation" placeholder="Designation">
                </div>
                <div class="form-group">
                    <label>Letter Content</label>
                    <textarea id="editContent" style="min-height: 300px; font-family: Georgia, serif;"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-cancel" onclick="closeEditModal()">Cancel</button>
                    <button type="button" class="btn btn-save" onclick="saveEditedLetter()">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/home.js') }}"></script>
</body>
</html>
